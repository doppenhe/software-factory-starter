name: preflight

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify repository
        run: bash scripts/verify.sh
      - name: Initialize sample project
        run: python3 scripts/init-project.py --name "CI Sample" --force
      - name: Preflight
        run: bash scripts/preflight.sh

